name: Update iOS ad-blocking rules

on:
  schedule:
    # Monday 04:17 Asia/Shanghai (UTC+8). GitHub may delay scheduled runs.
    - cron: '17 20 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Rules/**'
      - 'Config/**'
      - 'Scripts/**'
      - 'Tests/**'
      - 'Upstream/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: shadowrocket-weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test merge and failure handling
        run: python Tests/run.py
      - name: Download fixed upstream revision and validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python Scripts/build.py
      - name: Publish validated configuration
        shell: bash
        run: |
          set -euo pipefail
          git add sr_ios_adblock.conf Build-info.json
          if git diff --cached --quiet; then
            echo 'No output changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update upstream ad-blocking rules'
          git push origin HEAD:main
